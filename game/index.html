<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Portage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
      #world, #interface { position: fixed; inset: 0; }
      #world { touch-action: none; }
      /* The loading card: shown by the page itself while the game downloads and builds its world. `main.ts` removes it
         after the first frames. Only transforms move, so it keeps moving while the game's start holds the page busy.
         It never takes a click. */
      #loading {
        position: fixed; inset: 0; z-index: 10; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0b1020; color: #f3ebd9; font: 20px/1 Georgia, 'Iowan Old Style', serif; letter-spacing: 0.3em;
      }
      #loading svg { display: block; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      #loading .boat { width: 120px; margin-bottom: -9px; will-change: transform; animation: loading-rock 2.4s ease-in-out infinite; }
      #loading .water { width: 200px; overflow: hidden; color: #7f9eab; }
      #loading .water svg { width: 280px; will-change: transform; animation: loading-drift 1.6s linear infinite; }
      #loading p { margin: 26px 0 0; padding-left: 0.3em; text-transform: uppercase; }
      @keyframes loading-rock { 0%, 100% { transform: translateY(1px) rotate(-4deg); } 50% { transform: translateY(-2px) rotate(4deg); } }
      @keyframes loading-drift { to { transform: translateX(-40px); } }
      @media (prefers-reduced-motion: reduce) { #loading .boat, #loading .water svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="interface"></div>
    <div id="loading" role="status" aria-label="Loading Portage">
      <div class="boat"><svg viewBox="0 0 120 40"><path d="M6 14 Q60 30 114 14 Q104 33 60 34 Q16 33 6 14 Z M40 24 V31 M80 24 V31 M70 21 L96 2" /></svg></div>
      <div class="water"><svg viewBox="0 0 280 12"><path d="M0 6 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" /></svg></div>
      <p>Portage</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
